name: Build Word
on:
  workflow_dispatch:
  push:
    paths:
      - 'word_revision/**'
  pull_request:
    paths:
      - 'word_revision/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            word_revision
            最终稿
          sparse-checkout-cone-mode: true
      - run: python word_revision/build_docx.py
      - uses: actions/upload-artifact@v4
        with:
          name: revised-word
          path: word_revision/output/revised.docx
